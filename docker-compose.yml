services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  timescaledb:
    # timescaledb-ha bundles PostGIS — required for proximity detection.
    # If upgrading from timescale/timescaledb, run: docker compose down -v
    image: timescale/timescaledb-ha:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telemetry} -d ${POSTGRES_DB:-telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy

  px4-swarm:
    build: ./docker/px4-swarm
    profiles: [dev]
    environment:
      NUM_DRONES: ${PX4_NUM_DRONES:-3}
      VEHICLE: ${PX4_VEHICLE:-gz_x500}
      WORLD: ${PX4_WORLD:-default}
      DRONE_SPACING: ${PX4_DRONE_SPACING:-2}
      PX4_HOME_LAT: "40.7128"
      PX4_HOME_LON: "-74.0060"
      PX4_HOME_ALT: "10"
    # Expose MAVSDK ports for all 5 possible instances.
    # Only the ports for NUM_DRONES instances will actually be bound by PX4.
    ports:
      - "14540-14544:14540-14544/udp"
    restart: on-failure

  simulator:
    build: ./simulator
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-drone-telemetry}
      RUN_MODE: ${RUN_MODE:-scale}
      # dev mode — one address per PX4 instance (port = 14540 + instance)
      PX4_ADDRESSES: ${PX4_ADDRESSES:-udp://px4-swarm:14540,udp://px4-swarm:14541,udp://px4-swarm:14542}
      TELEMETRY_RATE_HZ: ${TELEMETRY_RATE_HZ:-2}
      # Fault injection: set FAULT_RATE=0.05 to inject faults into ~5% of records.
      # 0.0 (default) disables fault injection entirely.
      FAULT_RATE: ${FAULT_RATE:-0.0}
      # scale mode
      NUM_DRONES: ${NUM_DRONES:-100}
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build: ./consumer
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-drone-telemetry}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-telemetry-consumer}
      POSTGRES_HOST: timescaledb
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  proximity-consumer:
    build: ./proximity-consumer
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-drone-telemetry}
      KAFKA_ALERTS_TOPIC: ${KAFKA_ALERTS_TOPIC:-proximity-alerts}
      KAFKA_GROUP_ID: ${KAFKA_PROXIMITY_GROUP_ID:-proximity-consumer}
      POSTGRES_HOST: timescaledb
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
      PROXIMITY_THRESHOLD_M: ${PROXIMITY_THRESHOLD_M:-50.0}
      PROXIMITY_COOLDOWN_S: ${PROXIMITY_COOLDOWN_S:-10.0}
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
  grafana_data:
