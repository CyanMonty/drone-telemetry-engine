version: "3.9"

# ---------------------------------------------------------------------------
# Drone Swarm Telemetry Engine
#
# Services:
#   zookeeper  — Kafka coordination
#   kafka      — Message broker
#   simulator  — PX4 SITL swarm: produces to px4.telemetry.raw
#   parser     — Enriches raw telemetry → px4.telemetry.parsed
#   dashboard  — Streamlit real-time UI (http://localhost:8501)
# ---------------------------------------------------------------------------

networks:
  telemetry-net:
    driver: bridge

services:

  # --------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    networks: [telemetry-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: echo ruok | nc localhost 2181 | grep imok
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    networks: [telemetry-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"   # exposed to host for local debugging
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      # Two listeners: internal (kafka:29092) and host-accessible (localhost:9092)
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: kafka-topics --bootstrap-server kafka:29092 --list
      interval: 15s
      timeout: 10s
      retries: 10

  # --------------------------------------------------------------------------
  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: simulator
    networks: [telemetry-net]
    depends_on:
      kafka:
        condition: service_healthy
    command: python -m sim.swarm_simulator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NUM_DRONES: "5"
      SIM_UPDATE_HZ: "2.0"
      HOME_LAT: "37.8044"
      HOME_LON: "-122.4679"
      HOME_ALT: "10.0"
    restart: on-failure

  # --------------------------------------------------------------------------
  parser:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: parser
    networks: [telemetry-net]
    depends_on:
      kafka:
        condition: service_healthy
    command: python -m parser.telemetry_parser
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  # --------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: dashboard
    networks: [telemetry-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8501:8501"
    command: >
      streamlit run dashboard/app.py
        --server.port=8501
        --server.address=0.0.0.0
        --server.headless=true
        --browser.gatherUsageStats=false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  timescaledb:
    # timescaledb-ha bundles PostGIS — required for proximity detection.
    # If upgrading from timescale/timescaledb, run: docker compose down -v
    image: timescale/timescaledb-ha:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telemetry} -d ${POSTGRES_DB:-telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy

  px4-swarm:
    build: ./docker/px4-swarm
    profiles: [dev]
    environment:
      NUM_DRONES: ${PX4_NUM_DRONES:-3}
      VEHICLE: ${PX4_VEHICLE:-gz_x500}
      WORLD: ${PX4_WORLD:-default}
      DRONE_SPACING: ${PX4_DRONE_SPACING:-2}
      PX4_HOME_LAT: "40.7128"
      PX4_HOME_LON: "-74.0060"
      PX4_HOME_ALT: "10"
    # Expose MAVSDK ports for all 5 possible instances.
    # Only the ports for NUM_DRONES instances will actually be bound by PX4.
    ports:
      - "14540-14544:14540-14544/udp"
    restart: on-failure

  simulator:
    build: ./simulator
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-drone-telemetry}
      RUN_MODE: ${RUN_MODE:-scale}
      # dev mode — one address per PX4 instance (port = 14540 + instance)
      PX4_ADDRESSES: ${PX4_ADDRESSES:-udp://px4-swarm:14540,udp://px4-swarm:14541,udp://px4-swarm:14542}
      TELEMETRY_RATE_HZ: ${TELEMETRY_RATE_HZ:-2}
      # Fault injection: set FAULT_RATE=0.05 to inject faults into ~5% of records.
      # 0.0 (default) disables fault injection entirely.
      FAULT_RATE: ${FAULT_RATE:-0.0}
      # scale mode
      NUM_DRONES: ${NUM_DRONES:-100}
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build: ./consumer
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-drone-telemetry}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-telemetry-consumer}
      POSTGRES_HOST: timescaledb
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  proximity-consumer:
    build: ./proximity-consumer
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-drone-telemetry}
      KAFKA_ALERTS_TOPIC: ${KAFKA_ALERTS_TOPIC:-proximity-alerts}
      KAFKA_GROUP_ID: ${KAFKA_PROXIMITY_GROUP_ID:-proximity-consumer}
      POSTGRES_HOST: timescaledb
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
      PROXIMITY_THRESHOLD_M: ${PROXIMITY_THRESHOLD_M:-50.0}
      PROXIMITY_COOLDOWN_S: ${PROXIMITY_COOLDOWN_S:-10.0}
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
  grafana_data:
